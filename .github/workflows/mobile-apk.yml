name: Build installable Android app
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: https://saradars.ir
      EXPO_PUBLIC_DEMO_MODE: 'false'
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
        working-directory: mobile
      - name: Link or initialize Expo project
        run: npx eas init --non-interactive
        working-directory: mobile
      - name: Build Android APK with EAS
        id: eas-build
        run: |
          npx eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          cat eas-build.json
        working-directory: mobile
      - name: Download APK
        run: |
          APK_URL=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('mobile/eas-build.json','utf8')); const b=Array.isArray(d)?d[0]:d; process.stdout.write(b.artifacts?.buildUrl || b.artifacts?.applicationArchiveUrl || '')")
          test -n "$APK_URL"
          curl --fail --location "$APK_URL" --output mobile/roshd.apk
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-android-eas
          path: mobile/roshd.apk
          if-no-files-found: error
          retention-days: 14
