name: Build installable Android app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_API_URL: https://saradars.ir
      EXPO_PUBLIC_DEMO_MODE: 'false'
      CI: '1'
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
        working-directory: mobile
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: mobile
      - name: Build release APK
        shell: bash
        working-directory: mobile/android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          ./gradlew :app:assembleRelease \
            --no-daemon --no-watch-fs --no-configuration-cache --console=plain \
            --max-workers=2 \
            -x lintVitalAnalyzeRelease \
            -PreactNativeArchitectures=arm64-v8a
          apk_path="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$apk_path" ]; then
            echo "APK was not produced."
            exit 1
          fi
          echo "APK ready: $(du -h "$apk_path" | cut -f1)"
          keystore_path="$RUNNER_TEMP/roshd-release.keystore"
          keytool -genkeypair -v -keystore "$keystore_path" -storepass android -keypass android \
            -alias roshd -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Roshd, OU=Mobile, O=Roshd, L=Tehran, ST=Tehran, C=IR"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$apksigner_path" sign --ks "$keystore_path" --ks-pass pass:android --key-pass pass:android "$apk_path"
          "$apksigner_path" verify --verbose "$apk_path"
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-android-1.3.0
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
