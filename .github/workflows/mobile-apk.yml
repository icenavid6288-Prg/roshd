name: Build installable Android app
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: https://saradars.ir
      EXPO_PUBLIC_DEMO_MODE: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm install --no-audit --no-fund
        working-directory: mobile
      - run: npx expo install --fix --npm
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: markaz-android-installable
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
