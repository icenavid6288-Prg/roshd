name: Build deployment package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, openssl, pdo, pdo_mysql, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify deployment runtime
        run: |
          php -r "require 'vendor/autoload.php'; if (!class_exists(Illuminate\Foundation\Application::class)) exit(1);"
          test -s public/build/manifest.json

      - name: Create deployment archive
        run: |
          rm -rf deployment
          mkdir deployment
          # Never ship local secrets or caches: a stale .env (dev DB
          # credentials) or bootstrap/cache/config.php makes the installer
          # connect with credentials the user never typed, and a shipped
          # installed.lock makes the wizard redirect instead of running.
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='tests' \
            --exclude='.env' --exclude='bootstrap/cache' --exclude='storage/app/installed.lock' \
            --exclude='.deploy-config*' --exclude='.freebuff' --exclude='.deploy-last' \
            --exclude='*.zip' --exclude='*.tar.gz' --exclude='*.log' --exclude='*.ps1' \
            --exclude='composer.phar' \
            ./ deployment/
          mkdir -p deployment/bootstrap/cache deployment/storage/logs deployment/storage/framework/cache deployment/storage/framework/sessions deployment/storage/framework/views
          cd deployment
          zip -r ../markaz-deployment-${GITHUB_SHA::7}.zip . -x '*.DS_Store'

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: markaz-deployment-${{ github.sha }}
          path: markaz-deployment-*.zip
          retention-days: 14
